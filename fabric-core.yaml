name: Fabric Core
entryKey: obot-fabric-core
serverUserType: multiUser
shortDescription: Manage Microsoft Fabric workspaces, items, permissions, and capacities with natural language
description: |

  Fabric Core MCP Server is Microsoft's official remote Model Context Protocol server for Microsoft Fabric. It translates natural-language prompts into Fabric REST API calls while enforcing your existing Fabric role-based access control (RBAC) permissions, and Fabric records every call in its audit logs.

  ## Features
  - **Catalog search**: find items across workspaces in the OneLake Catalog by display name, description, or workspace name, optionally filtered by item type
  - **Workspace operations**: list, create, update, and delete workspaces
  - **Item management**: create, read, update, and delete Fabric items such as lakehouses, semantic models, notebooks, and pipelines
  - **Permission management**: grant, review, and revoke workspace roles (Admin, Member, Contributor, Viewer)
  - **Folder organization**: create, rename, move, and delete folders within a workspace
  - **Capacity information**: list available Fabric capacities and check long-running operation status

  ## What you'll need to connect

  This server is in preview and connects to your organization's Microsoft Fabric tenant. Sign in with your Microsoft Entra ID account when prompted; operations run under your own Fabric permissions and are subject to existing RBAC restrictions.
runtime: remote
remoteConfig:
  fixedURL: https://api.fabric.microsoft.com/v1/mcp/core
  staticOAuthRequired: true

toolPreview:
  - name: search_catalog
    description: Search the OneLake catalog for items across workspaces by display name, description, or workspace name, optionally filtered by item type.
  - name: list_workspaces
    description: List all Fabric workspaces you have access to.
  - name: get_workspace
    description: Get detailed information about a specific workspace.
  - name: create_workspace
    description: Create a new workspace in your Fabric tenant.
  - name: update_workspace
    description: Update a workspace's name or description.
  - name: delete_workspace
    description: Delete an existing workspace. This permanently removes all items within it.
  - name: add_workspace_role
    description: Grant a user access to a workspace.
  - name: list_workspace_roles
    description: List all role assignments for a workspace.
  - name: get_workspace_role
    description: Get details about a specific role assignment.
  - name: update_workspace_role
    description: Change a user's role in a workspace.
  - name: delete_workspace_role
    description: Remove a user's access to a workspace.
  - name: list_items
    description: List all items in a workspace.
  - name: get_item
    description: Get detailed information about a specific item.
  - name: create_item
    description: Create a new item in a workspace.
  - name: update_item
    description: Update an item's name or description.
  - name: delete_item
    description: Delete an item from a workspace.
  - name: get_item_definition
    description: Get the schema or definition of an item.
  - name: update_item_definition
    description: Update an item's definition or schema.
  - name: bulk_move_items
    description: Move multiple items to a folder.
  - name: create_folder
    description: Create a new folder in a workspace.
  - name: list_folders
    description: List all folders in a workspace.
  - name: get_folder
    description: Get details about a specific folder.
  - name: update_folder
    description: Rename a folder.
  - name: delete_folder
    description: Delete an empty folder. Folders must be empty before deletion.
  - name: move_folder
    description: Move a folder to a new parent folder.
  - name: list_capacities
    description: List all Fabric capacities you have access to.
  - name: get_operation_state
    description: Check the status of a long-running operation.
  - name: get_operation_result
    description: Get the result of a completed operation.
  - name: get_knowledge
    description: Get guidelines and best practices for Fabric item types.

metadata:
  categories: Data Analytics, Business Intelligence
icon: https://avatars.githubusercontent.com/u/6154722?s=200&v=4
repoURL: https://learn.microsoft.com/en-us/rest/api/fabric/articles/mcp-servers/core-remote/overview-core-mcp-server
