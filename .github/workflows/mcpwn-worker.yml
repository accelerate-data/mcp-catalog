name: Mcpwn Worker (scan one YAML target)
run-name: ${{ inputs.workflow_name || 'Mcpwn Scan' }} - ${{ inputs.file }}

on:
  workflow_dispatch:
    inputs:
      file:
        description: "Repo YAML file path"
        required: true
        type: string
      image:
        description: "Container image"
        required: true
        type: string
      port:
        description: "Container port to publish on 8080"
        required: true
        type: string
      args_b64:
        description: "Base64 JSON array of args"
        required: true
        type: string
      env_b64:
        description: "Base64 JSON array of env entries (key/value objects)"
        required: true
        type: string
      path:
        description: "MCP endpoint path the entry declares"
        required: false
        type: string
        default: "/"
      workflow_name:
        description: "Custom workflow name"
        required: false
        type: string
        default: "Mcpwn Scan"

permissions:
  contents: read
  packages: read
  # If you also want to upload SARIF into Code Scanning, uncomment:
  # security-events: write

jobs:
  scan:
    name: ${{ inputs.workflow_name }} - ${{ inputs.file }}
    # Accelerate Data addition: upstream runs this on a Depot pool that this
    # fork has no access to, so every dispatched worker queues until it expires
    # instead of scanning anything. GitHub-hosted runners are what we have.
    runs-on: ubuntu-latest

    steps:
      - name: Derive MCP_SERVER_NAME
        env:
          TARGET_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          MCP_SERVER_NAME="${TARGET_FILE%.yaml}"
          # avoid slashes in docker name
          MCP_SERVER_NAME="${MCP_SERVER_NAME//\//-}"
          echo "MCP_SERVER_NAME=$MCP_SERVER_NAME" >> $GITHUB_ENV
          echo "TARGET_FILE=$TARGET_FILE" >> $GITHUB_ENV

      - name: Checkout mcpwn
        uses: actions/checkout@v5
        with:
          repository: drpebcak/mcpwn
          ref: remote

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode args/env and build docker flags
        env:
          ARGS_B64: ${{ inputs.args_b64 }}
          ENV_B64: ${{ inputs.env_b64 }}
          IMAGE: ${{ inputs.image }}
          MCP_PATH: ${{ inputs.path }}
          TARGET_PORT: ${{ inputs.port }}
        run: |
          set -euo pipefail

          ARGS_JSON=$(echo "$ARGS_B64" | base64 -d | jq -c .)
          ENV_JSON=$(echo "$ENV_B64"  | base64 -d | jq -c .)

          if [[ ! "$TARGET_PORT" =~ ^[0-9]+$ ]] || (( TARGET_PORT < 1 || TARGET_PORT > 65535 )); then
            echo "Invalid container port: $TARGET_PORT" >&2
            exit 1
          fi
          if [[ -z "$IMAGE" ]]; then
            echo "Container image must not be empty" >&2
            exit 1
          fi

          # Accelerate Data addition: dispatch inputs are carried in the
          # environment rather than interpolated into shell source, so a value
          # can never terminate a quote and become a command. MCP_PATH reaches
          # the later steps through GITHUB_ENV because the scan step needs it
          # too, not only the readiness wait.
          {
            echo "ENV_JSON=$ENV_JSON"
            echo "ARGS_JSON=$ARGS_JSON"
            echo "IMAGE=$IMAGE"
            echo "TARGET_PORT=$TARGET_PORT"
            echo "MCP_PATH=${MCP_PATH:-/}"
          } >> "$GITHUB_ENV"

      - name: Start mcp server
        env: ${{ secrets }}
        run: |
          set -euo pipefail

          docker_args=(run -d --name "${MCP_SERVER_NAME}" -p "8080:${TARGET_PORT}")
          # The fan-out sends every env-typed entry, so an operator-supplied
          # input arrives without a static value. Only the ones carrying a
          # value are forwarded, as KEY=VALUE: a bare KEY would read the
          # runner's environment, which never holds the entry's value, and
          # would start the image with an empty variable.
          while IFS= read -r -d '' key && IFS= read -r -d '' value; do
            docker_args+=(-e "$key=$value")
          done < <(jq --raw-output0 '.[]? | select(.value != null) | .key, .value' <<< "${ENV_JSON:-[]}")

          server_args=()
          while IFS= read -r -d '' arg; do
            server_args+=("$arg")
          done < <(jq --raw-output0 '.[]?' <<< "${ARGS_JSON:-[]}")

          docker "${docker_args[@]}" "$IMAGE" ${server_args[@]+"${server_args[@]}"}

      - name: Wait for the mcp server to accept connections
        env:
          PORT: "8080"
        run: |
          set -euo pipefail

          # Accelerate Data addition: `docker run -d` returns as soon as the
          # container is created and a fixed `sleep 2` does not cover an image
          # that needs longer to bind, so the scanner used to connect too
          # early and die with ConnectionRefusedError. Wait for the endpoint,
          # bounded, and report the container's own logs when it exits.
          #
          # Readiness is an HTTP response, not a TCP connect: Docker's userland
          # proxy completes the handshake even when nothing inside the
          # container is listening, so a connect test succeeds against a
          # container that has not started serving.
          # Overridable so a test can exercise the timeout without waiting.
          READY_TIMEOUT_SECONDS=${READY_TIMEOUT_SECONDS:-60}
          started=$SECONDS
          deadline=$(( started + READY_TIMEOUT_SECONDS ))
          while (( SECONDS < deadline )); do
            state=$(docker inspect --format '{{.State.Status}}' "${MCP_SERVER_NAME}" 2>/dev/null || echo missing)
            if [[ "$state" == "exited" || "$state" == "dead" || "$state" == "missing" ]]; then
              echo "::error::Container ${MCP_SERVER_NAME} exited before accepting connections on port $PORT (state: $state)."
              docker logs "${MCP_SERVER_NAME}" 2>&1 || true
              exit 1
            fi
            # curl prints 000 itself when it cannot connect, so the exit
            # status is discarded rather than substituting a second value.
            status=$(curl -s -o /dev/null -m 2 -w '%{http_code}' \
              "http://127.0.0.1:${PORT}${MCP_PATH:-/}" 2>/dev/null || true)
            if [[ "$status" != "000" ]]; then
              echo "Container answered HTTP $status after $(( SECONDS - started ))s."
              exit 0
            fi
            sleep 1
          done

          echo "::error::Container ${MCP_SERVER_NAME} did not answer HTTP on port $PORT within ${READY_TIMEOUT_SECONDS}s."
          docker logs "${MCP_SERVER_NAME}" 2>&1 || true
          exit 1

      - name: Run mcpwn scan
        run: |
          set -euo pipefail
          MCP_PATH="${MCP_PATH:-/}"
          python3 mcpwn.py --output-sarif mcpwn-results.sarif --safe-mode "http://localhost:8080${MCP_PATH}"

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcpwn-results-${{ env.MCP_SERVER_NAME }}
          path: mcpwn-results.sarif
          retention-days: 1
