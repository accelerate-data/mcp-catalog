name: Curated Entry Contract

# Accelerate Data addition. Kept in its own workflow so upstream syncs of
# build.yml never conflict with it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curated-entry-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install YAML parser
        run: python -m pip install PyYAML

      - name: Validate curated catalog entries
        run: python scripts/curated-entry-contract/validate-curated-entries.py

      - name: Test curated catalog contracts
        run: >-
          python -m unittest discover
          -s scripts/curated-entry-contract/__tests__
          -p 'test_*.py' -v

      # Publishes the coverage table to the job summary, so a reviewer sees
      # which curated entries the mcpwn scan covers without opening a workflow.
      - name: Validate automated scan coverage
        run: python scripts/curated-entry-contract/validate-scan-coverage.py
