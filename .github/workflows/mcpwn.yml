name: Scan with Mcpwn
permissions:
  contents: read
  packages: read

on:
  # Accelerate Data addition: this workflow checks out and executes content
  # from the pull request, so it must run with the unprivileged PR token and
  # without repository secrets.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extract-config.outputs.file_configs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.yaml
          json: true
          escape_json: false
          use_rest_api: true

      - name: Extract config from changed files
        id: extract-config
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Accelerate Data addition: curated entries the scan cannot produce a
          # result for are declared in this file and dropped from the matrix
          # below, so they do not leave a check that never finishes. See
          # .github/mcpwn-scan-coverage.yaml for the reason and the review that
          # replaces the scan for each one.
          scan_coverage_file=".github/mcpwn-scan-coverage.yaml"

          changed_files="$CHANGED_FILES"

          if [ "$changed_files" == "[]" ] || [ -z "$changed_files" ]; then
            echo "file_configs=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build JSON array with file data
          file_configs="[]"

          while read -r file; do
            if [ -f "$file" ]; then
              containerized_config=$(yq eval '.containerizedConfig' "$file" -o=json -I=0)

              # Only include files that have containerizedConfig (not null)
              if [ "$containerized_config" != "null" ]; then
                # Accelerate Data addition: skip an entry declared unscannable.
                scan_coverage=""
                if [ -f "$scan_coverage_file" ]; then
                  scan_coverage=$(FILE="$file" yq eval \
                    '.entries[] | select(.file == strenv(FILE)) | .scan // ""' \
                    "$scan_coverage_file")
                fi
                if [ "$scan_coverage" == "manual" ]; then
                  echo "::notice file=$file::mcpwn scan skipped: $file is declared manually reviewed in $scan_coverage_file"
                  continue
                fi

                # Accelerate Data addition: the scan supplies the entry's
                # static config values and nothing else. A required input
                # whose value only the operator can provide stays unset, which
                # is why an entry that cannot start without one is declared
                # `manual` here rather than left to fail the scan. Static
                # values are forwarded as KEY=VALUE; forwarding a bare KEY
                # would read the runner's environment instead, which never
                # holds this input and would start the image with an empty
                # variable.
                env_config=$(yq eval \
                  '[.config[] | select(.usage == "env") | select(.value != null)]' \
                  "$file" -o=json -I=0)

                # Accelerate Data addition: the scan starts and probes the
                # container the entry declares. When a pull request changes
                # only entry metadata (an icon URL, a description), the
                # declared server is byte-identical to the base revision, so
                # there is nothing new to scan.
                if [ -n "$BASE_SHA" ] && base_content=$(git show "$BASE_SHA:$file" 2>/dev/null); then
                  base_containerized=$(printf '%s' "$base_content" | yq eval '.containerizedConfig' - -o=json -I=0)
                  base_env=$(printf '%s' "$base_content" | yq eval '[.config[] | select(.usage == "env") | select(.value != null)]' - -o=json -I=0)
                  if [ "$base_containerized" == "$containerized_config" ] && [ "$base_env" == "$env_config" ]; then
                    echo "::notice file=$file::mcpwn scan skipped: the declared server is unchanged from the base revision"
                    continue
                  fi
                fi

                # Create entry for this file
                entry=$(jq -n \
                  --arg file "$file" \
                  --argjson containerized "$containerized_config" \
                  --argjson env "$env_config" \
                  '{file: $file, containerizedConfig: $containerized, env: $env}')

                # Append to array
                file_configs=$(echo "$file_configs" | jq --argjson entry "$entry" '. += [$entry]')
              fi
            fi
          done < <(echo "$changed_files" | jq -r '.[]')

          # Output must be on single line for GitHub Actions
          echo "file_configs=$(echo "$file_configs" | jq -c .)" >> "$GITHUB_OUTPUT"

  mcpwn-scan:
    needs: generate-matrix
    # Accelerate Data addition: an empty matrix marks the workflow run failed
    # even though no job ran and every check on the pull request is green.
    # Skipping the job explicitly keeps the run green when a pull request
    # changes no scannable containerized entry.
    if: needs.generate-matrix.outputs.matrix != '' && needs.generate-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    # Accelerate Data addition: upstream runs this on a Depot pool that this
    # fork has no access to, so the job is created and then queues until it
    # expires roughly a day later. GitHub-hosted runners are what we have.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mcpwn
        uses: actions/checkout@v6
        with:
          fetch-depth: 1/
          # VD-8266: the fork carries the null-result discovery fix.
          repository: accelerate-data/Mcpwn
          ref: b835b16f565c43f43bf948ceb7ca8334441f7995

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start mcp server
        env:
          ARGS_JSON: ${{ toJson(matrix.server.containerizedConfig.args) }}
          ENV_JSON: ${{ toJson(matrix.server.env) }}
          IMAGE: ${{ matrix.server.containerizedConfig.image }}
          MCP_PATH: ${{ matrix.server.containerizedConfig.path }}
          PORT: ${{ matrix.server.containerizedConfig.port }}
        run: |
          set -euo pipefail

          if [[ ! "$PORT" =~ ^[0-9]+$ ]] || (( PORT < 1 || PORT > 65535 )); then
            echo "Invalid container port: $PORT" >&2
            exit 1
          fi
          if [[ -z "$IMAGE" ]]; then
            echo "Container image must not be empty" >&2
            exit 1
          fi

          # Accelerate Data addition: an entry declares where its MCP endpoint
          # lives, and several declare something other than the root. The scan
          # probes the declared path, so it is carried into the next step
          # rather than defaulting to "/".
          #
          # The value comes from catalog YAML in the pull request, and this
          # step writes it to $GITHUB_ENV, where a newline would start a second
          # variable assignment and inject env vars into the later steps that
          # run with the scan's token. Only a plain URL path is accepted.
          if [[ -z "$MCP_PATH" ]]; then
            MCP_PATH="/"
          fi
          if [[ ! "$MCP_PATH" =~ ^/[A-Za-z0-9._~/-]*$ ]]; then
            echo "Invalid MCP endpoint path: $MCP_PATH" >&2
            exit 1
          fi
          printf 'MCP_PATH=%s\n' "$MCP_PATH" >> "$GITHUB_ENV"

          # A malformed payload must fail here. A failing jq inside a process
          # substitution is invisible even under `set -o pipefail`, so the
          # container would otherwise start with no inputs and the readiness
          # wait would report a timeout instead of the real cause.
          #
          # `toJson` of an absent property is the literal string "null", which
          # is what an entry declaring no args produces, so null is valid.
          # Args may also be scalars: YAML reads an unquoted `8080` as a number,
          # which terraform declares, and jq stringifies it for the argv. Only a
          # nested structure is rejected — that is the shape that would fail
          # later in the unpacking loop, where the status is discarded.
          if ! jq -e 'type == "null" or (type == "array" and all(.[];
                type != "array" and type != "object"))' \
            <<< "${ARGS_JSON:-[]}" >/dev/null 2>&1; then
            echo "ARGS_JSON must be null or an array of scalars: $ARGS_JSON" >&2
            exit 1
          fi
          # Each forwarded input carries a static value; a `value` that is not a
          # scalar would reach docker as a literal repr, so it is required here.
          if ! jq -e 'type == "null" or (type == "array" and all(.[];
                type == "object"
                and (.key | type == "string")
                and (.value | type != "array" and type != "object")))' \
            <<< "${ENV_JSON:-[]}" >/dev/null 2>&1; then
            echo "ENV_JSON must be null or an array of key/value entries: $ENV_JSON" >&2
            exit 1
          fi

          docker_args=(run -d --name mcpwn-target -p "8080:$PORT")
          # Each forwarded input arrives as a key/value pair. The matrix step
          # already keeps only inputs that carry a static value, and the filter
          # here repeats that so an entry without one is skipped rather than
          # started as KEY=null; forwarding a bare key would read the runner's
          # environment and start the image with an empty variable.
          while IFS= read -r -d '' key && IFS= read -r -d '' value; do
            if [[ ! "$key" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "Invalid environment variable name: $key" >&2
              exit 1
            fi
            docker_args+=(-e "$key=$value")
          done < <(jq --raw-output0 '.[]? | select(.value != null) | .key, .value' <<< "$ENV_JSON")

          server_args=()
          while IFS= read -r -d '' arg; do
            server_args+=("$arg")
          done < <(jq --raw-output0 '.[]?' <<< "$ARGS_JSON")

          docker "${docker_args[@]}" "$IMAGE" ${server_args[@]+"${server_args[@]}"}

      - name: Wait for the mcp server to accept connections
        env:
          # Supplied by the start step through GITHUB_ENV; the default keeps the
          # step runnable on its own.
          MCP_PATH: ${{ matrix.server.containerizedConfig.path || '/' }}
          PORT: "8080"
        run: |
          # Accelerate Data addition: `docker run -d` returns as soon as the
          # container is created, so the scanner used to connect about a
          # second later and died with ConnectionRefusedError on an image that
          # needed several seconds to bind. Wait for the endpoint, bounded, and
          # report the container's own logs when it exits instead of leaving
          # the scanner to report a refused connection.
          #
          # Readiness is an HTTP response, not a TCP connect. Docker's userland
          # proxy publishes the host port and completes the handshake even when
          # nothing inside the container is listening, so a connect test
          # succeeds against a container that has not started serving.
          #
          # Any HTTP status counts: this proves the server is answering, while
          # the declared path is what the scan reports on, and an entry that
          # serves somewhere other than its declared path should surface as the
          # scan's 404 rather than as a readiness timeout.
          # Overridable so a test can exercise the timeout without waiting.
          MCP_PATH="${MCP_PATH:-/}"
          READY_TIMEOUT_SECONDS=${READY_TIMEOUT_SECONDS:-60}
          started=$SECONDS
          deadline=$(( started + READY_TIMEOUT_SECONDS ))
          while (( SECONDS < deadline )); do
            state=$(docker inspect --format '{{.State.Status}}' mcpwn-target 2>/dev/null || echo missing)
            if [[ "$state" == "exited" || "$state" == "dead" || "$state" == "missing" ]]; then
              echo "::error::Container exited before accepting connections on port $PORT (state: $state)."
              docker logs mcpwn-target 2>&1 || true
              exit 1
            fi
            # curl prints 000 itself when it cannot connect. Require a real
            # status: an empty value means curl was missing or produced no
            # output, which must not be read as ready.
            status=$(curl -s -o /dev/null -m 2 -w '%{http_code}' \
              "http://127.0.0.1:${PORT}${MCP_PATH}" 2>/dev/null || true)
            if [[ "$status" =~ ^[1-5][0-9]{2}$ ]]; then
              echo "Container answered HTTP $status on ${MCP_PATH} after $(( SECONDS - started ))s."
              exit 0
            fi
            sleep 1
          done

          echo "::error::Container did not answer HTTP on port $PORT within ${READY_TIMEOUT_SECONDS}s."
          docker logs mcpwn-target 2>&1 || true
          exit 1

      - name: Run mcpwn scan
        run: |
          python3 mcpwn.py --output-sarif mcpwn-results.sarif --safe-mode "http://localhost:8080${MCP_PATH}"

      - name: Checkout mcp-catalog
        uses: actions/checkout@v6
        with:
          path: mcp-catalog

      - name: Convert SARIF to Markdown
        run: |
          python3 mcp-catalog/.github/scripts/sarif_to_md.py mcpwn-results.sarif > sarif_comment.md

      - name: Publish scan summary
        run: cat sarif_comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        uses: actions/upload-artifact@v6
        with:
          name: mcpwn-results-${{ matrix.server.file }}
          path: mcpwn-results.sarif
