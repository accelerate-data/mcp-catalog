# Which curated catalog entries the automated mcpwn scan can cover.
#
# Accelerate Data addition. Two consumers read this file:
#
#   .github/workflows/mcpwn.yml
#       drops an entry marked `manual` from the scan matrix, so a pull request
#       adding it does not produce a check that cannot finish.
#   scripts/curated-entry-contract/validate-scan-coverage.py
#       requires every curated entry to appear here, and renders the result
#       into the Curated Entry Contract job summary so a reviewer sees the
#       coverage without opening a workflow file.
#
# Every curated (first-party) entry is listed. Catalog inventory inherited from
# upstream is absent and keeps upstream's automated-scan behaviour unchanged.
#
#   scan: automated   the scan is expected to produce a result, `reason`
#                     explains why, and that result gates the pull request.
#   scan: manual      the scan cannot produce a result for this entry.
#                     `reason` says why; `alternative` records the review
#                     performed in its place. Both are required.
#
# Marking an entry `manual` removes automated coverage. It is not a way to get
# an entry merged faster — the alternative review is the merge gate instead,
# and the contract check fails if it is missing.

version: 1

entries:
  - file: fabric-core.yaml
    scan: manual
    reason: >-
      Remote runtime. The scan starts a container image and probes it over
      localhost, so it never applies to an entry that points at a
      vendor-operated endpoint: the matrix step only emits entries declaring
      containerizedConfig. Pointing a security fuzzer at Microsoft's hosted
      Fabric API would also be unauthorized testing of a third party's service.
    alternative: >-
      The curated entry contract pins remoteConfig.fixedURL and
      staticOAuthRequired, and fails the build if the entry grows a native `config`
      input — so no deployment-wide credential can
      reach the vendor endpoint and authorization stays user-scoped OAuth.
      There is no first-party attack surface here: the entry contributes a URL
      and an auth contract, not a running server.

  - file: mailgun.yaml
    scan: manual
    reason: >-
      NPX stdio runtime. The scan matrix only starts entries declaring a
      containerizedConfig image and probes an HTTP endpoint on localhost, so
      it cannot launch or communicate with this package through stdio.
    alternative: >-
      The exact package @mailgun/mcp-server@2.1.2 was initialized through real
      Obot and its published tools were discovered through Studio's real
      AgentSession bridge. The curated entry contract pins that package,
      rejects runtime arguments and remote configuration, and permits only the
      reviewed MAILGUN_API_KEY and MAILGUN_API_REGION config inputs with usage env, with
      the API key required and sensitive.

  - file: resend.yaml
    scan: manual
    reason: >-
      Remote runtime. The mcpwn workflow fuzzes first-party container images on
      localhost; it does not attach to a vendor-hosted MCP endpoint, and
      aiming an automated security scanner at Resend's production service would
      be unauthorized third-party testing.
    alternative: >-
      The merge gate is a local contract review of the required Instance-owned
      bearer credential. The curated entry contract pins the hosted endpoint
      and exact required config entry with usage header for Authorization, and it rejects
      staticOAuthRequired, non-header config inputs, and per-user header
      prompts. This declaration does not claim provider certification.

  - file: remotes/exa_search.yaml
    scan: manual
    reason: >-
      Remote runtime. The mcpwn workflow fuzzes first-party container images on
      localhost; it does not attach to a vendor-hosted MCP endpoint, and
      aiming an automated security scanner at Exa's production service would
      be unauthorized third-party testing.
    alternative: >-
      The merge gate is a local contract review of the required Instance-owned
      API key. The curated entry contract pins the hosted endpoint template,
      the exact required, sensitive x-api-key config input with usage header, and the reviewed tool
      profiles, and it rejects credentials in the URL, static header values,
      staticOAuthRequired, and per-user header prompts. This declaration does
      not claim provider certification.
