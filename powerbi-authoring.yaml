name: Power BI Authoring
entryKey: obot-powerbi-authoring
shortDescription: Create and change Power BI semantic models with natural language
description: |
  Describe the modeling change you want in natural language and the agent applies it to your Power BI semantic model: adding measures, renaming objects across the model, generating translations, refactoring DAX, or running bulk changes across hundreds of objects.

  See Microsoft's [official Power BI Authoring MCP documentation](https://learn.microsoft.com/en-us/power-bi/developer/mcp/power-bi-authoring-mcp) for setup instructions, authentication requirements, and current capabilities.

  ## Features
  - **Natural-language authoring**: Create, update, and delete tables, columns, measures, relationships, hierarchies, calculation groups, perspectives, partitions, security roles, and more
  - **Bulk operations**: Bulk renames, refactoring, translations, and security rules across hundreds of objects at once
  - **Modeling best practices**: Evaluate a model against best practices and implement the fixes
  - **DAX validation**: Execute DAX queries to test measures, troubleshoot calculations, and explore data (100,000-row limit)

  ## What you'll need to connect

  Sign in with your Microsoft Entra ID account when prompted; tool calls run under your own permissions and Fabric role-based access control applies. You need Write permission on the semantic model to create or change model objects; with only Build permission the server can only run DAX queries.

  This hosted server works against semantic models in Fabric workspaces. It cannot reach models open in Power BI Desktop or Power BI Project files on disk, and it does not support transactions or trace tools. Back up the model before the agent edits it; changes can be irreversible.

metadata:
  categories: Data Analytics, Business Intelligence
icon: https://avatars.githubusercontent.com/u/6154722?s=200&v=4
