toolPreview:
  - name: connection_operations
    description: 'Connect to a semantic model in a Fabric workspace by model and workspace name; start here before any modeling change.'
  - name: database_operations
    description: 'Manage semantic models: list, create, and update models, import and export TMDL folders, and deploy to Fabric.'
  - name: model_operations
    description: 'Work with the overall model: get details and stats, create, update, refresh, and rename.'
  - name: table_operations
    description: 'Manage tables: create, update, delete, get, list, refresh, and rename.'
  - name: column_operations
    description: 'Manage individual table columns: create, update, delete, get, list, and rename.'
  - name: measure_operations
    description: 'Manage individual DAX measures: create, update, delete, get, list, rename, and move between tables.'
  - name: relationship_operations
    description: 'Handle relationships between tables: create, update, delete, activate and deactivate, and find.'
  - name: dax_query_operations
    description: 'Execute and validate DAX queries against the model to test measures and explore data.'
  - name: partition_operations
    description: 'Manage table partitions: create, update, delete, and refresh specific partitions.'
  - name: user_hierarchy_operations
    description: 'Work with user-defined hierarchies: create, update, and delete levels, and reorder them.'
  - name: calculation_group_operations
    description: 'Manage calculation groups and calculation items for time intelligence and other calculations.'
  - name: security_role_operations
    description: 'Configure security roles and row-level security table permissions.'
  - name: perspective_operations
    description: 'Manage perspectives and their members as filtered views of the model for different audiences.'
  - name: named_expression_operations
    description: 'Work with named expressions and Power Query parameters: create, update, delete, get, list, and rename.'
  - name: function_operations
    description: 'Manage individual DAX user-defined functions.'
  - name: culture_operations
    description: 'Manage cultures for multi-language support: create, update, delete, and get valid culture names.'
  - name: object_translation_operations
    description: 'Handle translations for model objects across different cultures and languages.'
  - name: calendar_operations
    description: 'Manage calendar objects and time-intelligence column groups.'
  - name: query_group_operations
    description: 'Organize and manage query groups for Power Query expressions.'
